name: factory
# Every trigger runs this file from main, so fire tokens never reach branch code.
on:
  push:
    branches: [main]
    paths: [GOALS.md]
  issue_comment:
    types: [created]
  issues:
    types: [opened, labeled, edited]
  workflow_run:
    workflows: [ci]
    types: [completed]
  pull_request_target:
    types: [closed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      fault_point:
        description: Disposable Stage A crash point; leave as none for normal operation
        required: false
        default: none
        type: choice
        options:
          - none
          - after-journal-append
          - after-task-operation-intent
          - after-task-issue-create
concurrency:
  group: factory
  cancel-in-progress: false
# contents: write exists only so this job can merge a validated pull request.
permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  actions: write
jobs:
  dispatch:
    # Fire tokens are secrets of this environment, which deploys only from
    # main, so a workflow pushed to any other branch cannot read them.
    environment: factory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - run: node .github/factory/run.mjs
        env:
          # The ephemeral token is scoped to this repository and this job.
          # Follow-up workflows are dispatched explicitly when needed; never
          # store a broad personal token in a disposable or product repository.
          GITHUB_TOKEN: ${{ github.token }}
          # One Claude routine per model; planner, escalation and final review
          # use Opus, worker and task review use Sonnet. No fallback.
          FACTORY_ROUTINE_ID_OPUS: ${{ vars.FACTORY_ROUTINE_ID_OPUS }}
          FACTORY_FIRE_TOKEN_OPUS: ${{ secrets.FACTORY_FIRE_TOKEN_OPUS }}
          FACTORY_ROUTINE_ID_SONNET: ${{ vars.FACTORY_ROUTINE_ID_SONNET }}
          FACTORY_FIRE_TOKEN_SONNET: ${{ secrets.FACTORY_FIRE_TOKEN_SONNET }}
          FACTORY_REVIEWER_LOGIN: ${{ vars.FACTORY_REVIEWER_LOGIN }}
          FACTORY_WORKER_LOGIN: ${{ vars.FACTORY_WORKER_LOGIN }}
          FACTORY_OWNER_LOGIN: ${{ vars.FACTORY_OWNER_LOGIN }}
          FACTORY_ACTIVE_PROVIDER: ${{ vars.FACTORY_ACTIVE_PROVIDER }}
          FACTORY_CODEX_EXECUTION_MODE: ${{ vars.FACTORY_CODEX_EXECUTION_MODE }}
          FACTORY_CREDENTIAL_ISOLATED: ${{ vars.FACTORY_CREDENTIAL_ISOLATED }}
          FACTORY_MAX_INVOCATIONS: ${{ vars.FACTORY_MAX_INVOCATIONS }}
          FACTORY_MAX_TASKS: ${{ vars.FACTORY_MAX_TASKS }}
          FACTORY_PROVIDER_RESUME_NONCE: ${{ vars.FACTORY_PROVIDER_RESUME_NONCE }}
          FACTORY_AGENT_EXECUTION: ${{ vars.FACTORY_AGENT_EXECUTION }}
          FACTORY_DISPATCHER_LOGIN: ${{ vars.FACTORY_DISPATCHER_LOGIN || 'github-actions[bot]' }}
          FACTORY_INTEGRATION_TEST: ${{ vars.FACTORY_INTEGRATION_TEST }}
          FACTORY_INTEGRATION_REPOSITORY: ${{ vars.FACTORY_INTEGRATION_REPOSITORY }}
          FACTORY_FAULT_POINT: ${{ inputs.fault_point }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
